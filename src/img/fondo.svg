<?xml version="1.0" encoding="UTF-8"?>
<!--
  El fondo. Es un dibujo ORIGINAL, no la foto de Windows XP.

  La versión de 2024 traía la foto «Bliss» enlazada desde el blog de un
  tercero: un hotlink a material con copyright de Microsoft, que además se
  puede caer cualquier día sin avisar. Esto es un homenaje dibujado a mano —
  la misma loma, el mismo cielo, la misma idea— que pesa 2 KB, no depende de
  nadie y escala a cualquier pantalla sin pixelarse.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1b5fc4"/>
      <stop offset="42%"  stop-color="#4a9ae8"/>
      <stop offset="78%"  stop-color="#9fd2f5"/>
      <stop offset="100%" stop-color="#d8ecfb"/>
    </linearGradient>
    <linearGradient id="loma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8dc63f"/>
      <stop offset="45%"  stop-color="#6aa82c"/>
      <stop offset="100%" stop-color="#3f7a18"/>
    </linearGradient>
    <linearGradient id="loma2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a8d65a"/>
      <stop offset="100%" stop-color="#6fae2f"/>
    </linearGradient>
    <radialGradient id="nube">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#cielo)"/>

  <!-- Nubes: óvalos difuminados y nada más. Tres tamaños para que no se lea
       el patrón. -->
  <g>
    <ellipse cx="240"  cy="180" rx="210" ry="62" fill="url(#nube)"/>
    <ellipse cx="330"  cy="150" rx="140" ry="48" fill="url(#nube)"/>
    <ellipse cx="760"  cy="120" rx="170" ry="44" fill="url(#nube)"/>
    <ellipse cx="1180" cy="210" rx="250" ry="70" fill="url(#nube)"/>
    <ellipse cx="1300" cy="178" rx="150" ry="46" fill="url(#nube)"/>
    <ellipse cx="520"  cy="300" rx="190" ry="40" fill="url(#nube)" opacity="0.6"/>
    <ellipse cx="1460" cy="330" rx="160" ry="38" fill="url(#nube)" opacity="0.5"/>
  </g>

  <!-- La loma de atrás, más clara y más plana: da la sensación de distancia. -->
  <path d="M0 640 C 300 560, 620 600, 900 575 C 1180 550, 1400 590, 1600 565 L1600 1000 L0 1000 Z"
        fill="url(#loma2)" opacity="0.85"/>

  <!-- La loma principal. La curva sube por la izquierda y cae a la derecha,
       que es lo que hace que se reconozca de un vistazo. -->
  <path d="M0 760 C 260 610, 560 585, 880 640 C 1140 685, 1380 730, 1600 700 L1600 1000 L0 1000 Z"
        fill="url(#loma)"/>

  <!-- Un velo de luz sobre la hierba, para que no se vea como un color plano. -->
  <path d="M0 760 C 260 610, 560 585, 880 640 C 1140 685, 1380 730, 1600 700 L1600 820 C 1380 850, 1140 805, 880 760 C 560 705, 260 730, 0 880 Z"
        fill="#ffffff" opacity="0.12"/>
</svg>
